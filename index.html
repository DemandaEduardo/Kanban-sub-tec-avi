<title>Fluxo de Substituição de Insumos</title>
<style>
  :root{
    --bg:#E6E4DC;
    --surface:#FBFAF7;
    --surface-raised:#FFFFFF;
    --ink:#20242A;
    --ink-soft:#5C6169;
    --ink-faint:#8A8E93;
    --line:#D6D2C6;
    --line-soft:#DEDBD0;
    --accent:#2C4A70;
    --accent-strong:#1F3654;
    --accent-soft:rgba(44,74,112,0.12);
    --accent-ink:#FFFFFF;
    --success:#3F7A5C;
    --success-soft:rgba(63,122,92,0.14);
    --danger:#B23B3B;
    --danger-soft:rgba(178,59,59,0.14);
    --yellow:#9C7A0A;
    --yellow-soft:rgba(156,122,10,0.16);
    --blue:#2E6DA4;
    --blue-soft:rgba(46,109,164,0.14);
    --shadow-card:0 1px 2px rgba(32,36,42,0.06), 0 1px 1px rgba(32,36,42,0.04);
    --shadow-card-hover:0 6px 16px rgba(32,36,42,0.12), 0 2px 4px rgba(32,36,42,0.06);
    --shadow-panel:-8px 0 32px rgba(20,22,26,0.18);
    --col-compras:#E6E4DC;
    --col-demanda-inicial:#EFE6D3;
    --col-engenharia:#E3E3ED;
    --col-demanda-final:#DEE9E6;
    --col-concluido:#DEEBDF;
    --col-compras-accent:#8A8574;
    --col-demanda-inicial-accent:#B8955A;
    --col-engenharia-accent:#6B5C99;
    --col-demanda-final-accent:#3F8C7A;
    --col-concluido-accent:#3F7A5C;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171A;
      --surface:#1D2126;
      --surface-raised:#242830;
      --ink:#E8E6DF;
      --ink-soft:#9BA1A6;
      --ink-faint:#6E7378;
      --line:#33383D;
      --line-soft:#2A2F34;
      --accent:#8FADD1;
      --accent-strong:#AEC4E2;
      --accent-soft:rgba(143,173,209,0.16);
      --accent-ink:#151A20;
      --success:#6FBF97;
      --success-soft:rgba(111,191,151,0.16);
      --danger:#E68383;
      --danger-soft:rgba(230,131,131,0.18);
      --yellow:#E8CB5C;
      --yellow-soft:rgba(232,203,92,0.18);
      --blue:#7FAEDD;
      --blue-soft:rgba(127,174,221,0.18);
      --shadow-card:0 1px 2px rgba(0,0,0,0.3);
      --shadow-card-hover:0 8px 20px rgba(0,0,0,0.4);
      --shadow-panel:-8px 0 32px rgba(0,0,0,0.5);
      --col-compras:#1B1E22;
      --col-demanda-inicial:#221E17;
      --col-engenharia:#1C1C26;
      --col-demanda-final:#16201D;
      --col-concluido:#171F19;
      --col-compras-accent:#7C8790;
      --col-demanda-inicial-accent:#C9A05F;
      --col-engenharia-accent:#8B7EC0;
      --col-demanda-final-accent:#5CB39D;
      --col-concluido-accent:#6FBF97;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171A; --surface:#1D2126; --surface-raised:#242830; --ink:#E8E6DF; --ink-soft:#9BA1A6; --ink-faint:#6E7378;
    --line:#33383D; --line-soft:#2A2F34; --accent:#8FADD1; --accent-strong:#AEC4E2; --accent-soft:rgba(143,173,209,0.16);
    --accent-ink:#151A20; --success:#6FBF97; --success-soft:rgba(111,191,151,0.16); --danger:#E68383; --danger-soft:rgba(230,131,131,0.18);
    --yellow:#E8CB5C; --yellow-soft:rgba(232,203,92,0.18);
    --blue:#7FAEDD; --blue-soft:rgba(127,174,221,0.18);
    --shadow-card:0 1px 2px rgba(0,0,0,0.3); --shadow-card-hover:0 8px 20px rgba(0,0,0,0.4); --shadow-panel:-8px 0 32px rgba(0,0,0,0.5);
    --col-compras:#1B1E22; --col-demanda-inicial:#221E17; --col-engenharia:#1C1C26; --col-demanda-final:#16201D; --col-concluido:#171F19;
    --col-compras-accent:#7C8790; --col-demanda-inicial-accent:#C9A05F; --col-engenharia-accent:#8B7EC0; --col-demanda-final-accent:#5CB39D; --col-concluido-accent:#6FBF97;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#E6E4DC; --surface:#FBFAF7; --surface-raised:#FFFFFF; --ink:#20242A; --ink-soft:#5C6169; --ink-faint:#8A8E93;
    --line:#D6D2C6; --line-soft:#DEDBD0; --accent:#2C4A70; --accent-strong:#1F3654; --accent-soft:rgba(44,74,112,0.12);
    --accent-ink:#FFFFFF; --success:#3F7A5C; --success-soft:rgba(63,122,92,0.14); --danger:#B23B3B; --danger-soft:rgba(178,59,59,0.14);
    --yellow:#9C7A0A; --yellow-soft:rgba(156,122,10,0.16);
    --blue:#2E6DA4; --blue-soft:rgba(46,109,164,0.14);
    --shadow-card:0 1px 2px rgba(32,36,42,0.06), 0 1px 1px rgba(32,36,42,0.04); --shadow-card-hover:0 6px 16px rgba(32,36,42,0.12), 0 2px 4px rgba(32,36,42,0.06);
    --shadow-panel:-8px 0 32px rgba(20,22,26,0.18);
    --col-compras:#E6E4DC; --col-demanda-inicial:#EFE6D3; --col-engenharia:#E3E3ED; --col-demanda-final:#DEE9E6; --col-concluido:#DEEBDF;
    --col-compras-accent:#8A8574; --col-demanda-inicial-accent:#B8955A; --col-engenharia-accent:#6B5C99; --col-demanda-final-accent:#3F8C7A; --col-concluido-accent:#3F7A5C;
    color-scheme: light;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- App shell ---------- */
  .app{display:flex;flex-direction:column;min-height:100vh;}

  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:20px 28px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;flex:none;
    background:
      repeating-linear-gradient(45deg, var(--accent-soft) 0 3px, transparent 3px 6px),
      var(--surface-raised);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:18px;height:18px;color:var(--accent);}
  .topbar h1{
    font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em;
  }
  .topbar .subtitle{
    font-size:12.5px;color:var(--ink-soft);margin-top:2px;
  }
  .topbar-spacer{flex:1;}
  .theme-note{font-size:11.5px;color:var(--ink-faint);}

  .search-box{
    position:relative;display:flex;align-items:center;
    flex:0 1 300px;min-width:200px;
  }
  .search-box svg{
    position:absolute;left:10px;width:14px;height:14px;color:var(--ink-faint);pointer-events:none;
  }
  .search-box input{
    width:100%;font-family:inherit;font-size:12.5px;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px 8px 30px;
  }
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .search-box input::placeholder{color:var(--ink-faint);}

  /* ---------- Stats strip ---------- */
  .stats{
    display:flex;gap:10px;padding:14px 28px;overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  .stat-tile{
    flex:1 1 0;min-width:150px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;display:flex;flex-direction:column;gap:2px;
  }
  .stat-tile .label{
    font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-faint);
  }
  .stat-tile .row{display:flex;align-items:baseline;gap:8px;}
  .stat-tile .count{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .stat-tile .late{
    font-size:11px;font-weight:600;color:var(--danger);
    display:flex;align-items:center;gap:4px;
  }
  .stat-tile .late::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--danger);
  }

  /* ---------- Board ---------- */
  .board-wrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:20px 28px 28px;}
  .board{display:flex;gap:16px;height:100%;min-height:0;width:max-content;}
  .column{
    width:308px;flex:none;display:flex;flex-direction:column;
    background:var(--col-bg);
    border:1px solid var(--line-soft);
    border-radius:14px;
    max-height:calc(100vh - 210px);
  }
  .column-head{
    padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;gap:8px;position:relative;
  }
  .column-head::before{
    content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;
    background:var(--col-accent);
  }
  .column-title{
    font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);
    margin-top:2px;
  }
  .column-count{
    font-size:11px;font-weight:700;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:1px 8px;margin-left:auto;margin-top:2px;
  }
  .column-filter-row{padding:8px 14px 0;}
  .brand-filter-select{
    width:100%;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;
    padding:5px 8px;cursor:pointer;
  }
  .brand-filter-select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .brand-filter-select:disabled{opacity:0.5;cursor:not-allowed;}

  .new-request-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
    padding:8px 12px;margin:10px 12px 4px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .new-request-btn:hover{filter:brightness(1.08);}
  .new-request-btn:active{transform:scale(0.97);}
  .new-request-btn svg{width:14px;height:14px;}

  .card-list{
    flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;min-height:60px;
  }
  .card-list.drag-over{background:var(--accent-soft);border-radius:10px;}
  .card-list.drag-over-invalid{background:var(--danger-soft);border-radius:10px;}

  .empty-hint{
    font-size:12px;color:var(--ink-faint);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--surface-raised);
    border:1px solid var(--line-soft);
    border-left:3px solid var(--brand-color, var(--accent));
    border-radius:10px;
    padding:11px 12px 10px;
    box-shadow:var(--shadow-card);
    cursor:grab;
    animation:card-in .18s ease;
  }
  @keyframes card-in{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }
  .card:hover{box-shadow:var(--shadow-card-hover);}
  .card.dragging{opacity:0.4;}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .card-row-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .image-indicator{
    margin-left:auto;flex:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);
  }
  .image-indicator svg{width:14px;height:14px;display:block;}
  .brand-chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:700;letter-spacing:0.02em;
    padding:3px 8px;border-radius:999px;
    background:var(--brand-bg);color:var(--brand-fg);
    white-space:nowrap;
  }
  .brand-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.75;}

  .ref-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
  .ref-pill{
    font-size:10.5px;font-weight:600;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1.5px 6px;
  }
  .ref-pill.more{color:var(--ink-faint);background:transparent;border-style:dashed;}

  .card-title{
    font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-0.005em;
    margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-substitute-row{
    display:flex;align-items:center;gap:5px;margin-bottom:8px;min-width:0;
    font-size:11.5px;font-weight:600;color:var(--success);
  }
  .card-substitute-row .swap-arrow{flex:none;display:flex;color:var(--ink-faint);}
  .card-substitute-row .swap-arrow svg{width:11px;height:11px;display:block;}
  .card-substitute-row .text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

  .swap-row{display:flex;align-items:center;gap:6px;min-width:0;}
  .swap-chip{
    font-size:11px;font-weight:600;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2.5px 7px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 0;
  }
  .swap-chip.substitute{border-color:var(--success);color:var(--success);background:var(--success-soft);}
  .swap-arrow{flex:none;color:var(--ink-faint);display:flex;}
  .swap-arrow svg{width:12px;height:12px;display:block;}

  .card-details{
    font-size:12px;color:var(--ink-soft);margin-bottom:9px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .card-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .time-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:600;
    padding:3px 7px;border-radius:6px;
    background:var(--bg);color:var(--ink-soft);
  }
  .time-badge svg{width:10px;height:10px;}
  .time-badge.late{background:var(--danger-soft);color:var(--danger);}

  .stage-dots{display:flex;gap:3px;margin-left:auto;}
  .stage-dots span{width:5px;height:5px;border-radius:50%;background:var(--line);}
  .stage-dots span.active{background:var(--col-accent);}
  .stage-dots span.past{background:var(--ink-faint);}

  .eng-flags{display:flex;gap:3px;}
  .eng-flag{
    width:16px;height:16px;border-radius:4px;
    font-size:9.5px;font-weight:800;color:#fff;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .eng-flag.done{background:var(--success);}
  .eng-flag.pending{background:var(--danger);}

  .eng-flags-toggle{display:flex;gap:10px;flex-wrap:wrap;padding-left:52px;}

  .final-status-dot{width:16px;height:16px;border-radius:50%;flex:none;}
  .final-status-dot.red{background:var(--danger);}
  .final-status-dot.yellow{background:var(--yellow);}
  .final-status-dot.blue{background:var(--blue);}
  .final-status-dot.green{background:var(--success);}

  /* ---------- Overlay + Panel ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,0.42);
    opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .panel{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);
    background:var(--surface);border-left:1px solid var(--line);
    box-shadow:var(--shadow-panel);
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;z-index:41;
  }
  .panel.open{transform:translateX(0);}
  @media (prefers-reduced-motion: reduce){
    .overlay,.panel{transition:none;}
  }

  .panel-head{
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
    display:flex;gap:12px;align-items:flex-start;
  }
  .panel-head .titles{flex:1;min-width:0;}
  .panel-head .code{font-size:17px;font-weight:700;letter-spacing:-0.01em;word-break:break-word;}
  .panel-head .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;
  }
  .icon-btn:hover{background:var(--bg);color:var(--ink);}
  .icon-btn svg{width:15px;height:15px;}

  .panel-body{flex:1;overflow-y:auto;padding:6px 20px 24px;}
  .panel-section{padding:16px 0;border-bottom:1px solid var(--line-soft);}
  .panel-section:last-child{border-bottom:none;}
  .section-label{
    font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .section-label .badge{
    font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:0;text-transform:none;
    background:var(--bg);color:var(--ink-soft);
  }
  .section-label .badge.ok{background:var(--success-soft);color:var(--success);}
  .section-label .badge.pending{background:var(--danger-soft);color:var(--danger);}
  .section-label .badge.caution{background:var(--yellow-soft);color:var(--yellow);}
  .section-label .badge.info{background:var(--blue-soft);color:var(--blue);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type="text"], .field select, .field textarea{
    width:100%;font-family:inherit;font-size:13px;color:var(--ink);
    background:var(--surface-raised);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--accent);outline-offset:0;border-color:transparent;
  }
  .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}

  .file-field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .file-field input[type="file"]{display:none;}
  .file-btn{
    font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface-raised);color:var(--ink);
  }
  .file-btn:hover{border-color:var(--accent);}
  .file-preview{display:none;align-items:center;gap:8px;}
  .file-preview.has-image{display:flex;}
  .file-preview img{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--line);}
  .file-remove{background:none;border:none;color:var(--danger);font-size:11.5px;font-weight:600;cursor:pointer;padding:0;}
  .file-remove:hover{text-decoration:underline;}

  .attachment-preview{
    display:block;width:100%;max-height:220px;object-fit:cover;border-radius:9px;
    border:1px solid var(--line);cursor:zoom-in;margin-bottom:6px;
  }

  .detail-text{font-size:12.5px;color:var(--ink-soft);white-space:pre-wrap;}

  .ref-action-block{padding:8px 0;border-bottom:1px dashed var(--line-soft);}
  .ref-action-block:last-child{border-bottom:none;}
  .ref-action-block .action-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .ref-action-block .action-row .ref-tag{
    font-size:11.5px;font-weight:700;color:var(--ink);background:var(--bg);
    border-radius:6px;padding:3px 7px;flex:none;min-width:44px;text-align:center;
  }
  .ref-action-block .action-row select{
    flex:1;font-size:12.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-raised);color:var(--ink);
  }
  .ref-action-block .readonly-action{
    flex:1;font-size:12.5px;color:var(--ink-soft);
  }
  .ref-action-block .depara-row{display:flex;align-items:center;gap:8px;padding-left:52px;flex-wrap:wrap;}
  .depara-label{font-size:11px;font-weight:600;color:var(--ink-faint);white-space:nowrap;}
  .depara-input{
    width:76px;font-size:12.5px;padding:5px 7px;border-radius:6px;
    border:1px solid var(--line);background:var(--surface-raised);color:var(--ink);
  }
  .depara-input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .check-label{

    var seeds = [

        engFlags:{ "1500":{encaixe:true,sequencia:true,ficha:true}, "1501":{encaixe:true,sequencia:true,ficha:true}, "1502":{encaixe:true,sequencia:true,ficha:true} }

  function applyRemoteState(parsed){
    parsed.cards.forEach(ensureEngFlags);
    parsed.cards.forEach(ensureFinalActions);
    state = parsed;
  }
  function load(){
    return fetch("/api/state").then(function(res){
      if (!res.ok) throw new Error("bad status");
      return res.json();
    }).then(function(parsed){
      if (parsed && Array.isArray(parsed.cards)){
        applyRemoteState(parsed);
        lastSyncedJson = JSON.stringify(state);
        return;
      }
      // Servidor ainda não tem dados: popular com exemplos e gravar.
      state = { cards: seedCards() };
      return save();
    }).catch(function(){
      // Falha de rede: não sobrescrever os dados do servidor, só exibir exemplos offline.
      state = { cards: seedCards() };
      toast("Não foi possível conectar ao servidor. Exibindo dados de exemplo offline.", "error");
    });
  }
  function save(){
    var payload = JSON.stringify(state);
    return fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: payload
    }).then(function(res){
      if (!res.ok) throw new Error("bad status");
      lastSyncedJson = payload;
      return true;
    }).catch(function(){
      toast("Falha ao sincronizar com o servidor. Verifique a conexão.", "error");
      return false;
    });
  }
  function pollSync(){
    fetch("/api/state").then(function(res){
      if (!res.ok) throw new Error("bad status");
      return res.text();
    }).then(function(text){
      if (text === lastSyncedJson) return;
      var parsed;
      try{ parsed = JSON.parse(text); }catch(e){ return; }
      if (!parsed || !Array.isArray(parsed.cards)) return;
      applyRemoteState(parsed);
      lastSyncedJson = text;
      renderAll();
      if (panelCardId){
        if (state.cards.some(function(c){ return c.id === panelCardId; })) renderPanel();
        else closePanel();
      }
    }).catch(function(){ /* falha de rede intermitente: ignora, tenta de novo no próximo ciclo */ });
  }
  function downscaleImage(file, maxDim, quality, onDone, onError){
    var reader = new FileReader();
    reader.onerror = function(){ onError && onError(); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ onError && onError(); };
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        onDone(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------- Business rules ---------- */
  function initialComplete(card){
    return card.references.every(function(r){ return card.actionsInitial[r] && card.actionsInitial[r].action; });

    var flagsByRef = card.engFlags || {};
    return card.references.every(function(r){
      var f = flagsByRef[r];
      return f && ENG_FLAGS.every(function(flag){ return !!f[flag.key]; });
    });
  }
  function finalRefActionObsComplete(card, r){
    var f = card.actionsFinal[r];
    return !!(f && f.action && f.observacao && f.observacao.trim());
  }
  function finalActionObsComplete(card){
    return card.references.every(function(r){ return finalRefActionObsComplete(card, r); });
  }
  function finalComplete(card){
    return card.references.every(function(r){ return finalRefActionObsComplete(card, r) && card.actionsFinal[r].finalized; });
  }
  function finalStatus(card){
    if (finalComplete(card)) return "green";
    if (finalActionObsComplete(card)) return "blue";
    var anyStarted = card.references.some(function(r){
      var f = card.actionsFinal[r];
      return !!(f && (f.action || (f.observacao && f.observacao.trim())));
    });
    return anyStarted ? "yellow" : "red";
  }
  var FINAL_STATUS_LABEL = { red:"Pendente", yellow:"Em andamento", blue:"Falta finalizar", green:"Concluído" };
  var FINAL_STATUS_BADGE_CLASS = { red:"pending", yellow:"caution", blue:"info", green:"ok" };
  function validateMove(card, dest){
    if (dest === card.column) return { ok:true };
    if (dest === "engenharia" && !initialComplete(card)){
      return { ok:false, reason:"Defina uma ação (Trocar ou Criar alternativa) para cada referência na Demanda (Inicial) antes de mover para Engenharia." };
    }
    if (dest === "demanda_final" && !engineeringComplete(card)){
      return { ok:false, reason:"Todas as ações de Engenharia precisam estar marcadas como Concluídas antes de mover para Demanda (Final)." };
    }
    if (dest === "concluido" && !finalComplete(card)){
      return { ok:false, reason:"Preencha ação e observação de todas as referências e marque-as como Finalizada na Demanda (Final) antes de concluir o cartão." };
    }
    return { ok:true };
  }
  function moveCard(cardId, dest){
    var card = state.cards.find(function(c){ return c.id === cardId; });
    if (!card) return;
    if (dest === card.column) return;
    var v = validateMove(card, dest);
    if (!v.ok){
      toast(v.reason, "error");
      return;
    }
    var fromStage = card.column;
    card.column = dest;
    card.enteredColumnAt = Date.now();
    save();
    renderAll();
    if (panelCardId === cardId) renderPanel();
    toast("Cartão movido para " + colLabel(dest) + ".", "success");
    notifyStageMove(card, fromStage, dest);
  }

    stack.appendChild(el);

      setTimeout(function(){ el.remove(); }, 220);

  /* ---------- Rendering: board ---------- */
  function renderCard(card){
    var brand = brandOf(card.brand);
    var totalDays = daysBetween(card.createdAt);
    var colDays = daysBetween(card.enteredColumnAt);
    var late = colDays >= 3;
    var visibleRefs = card.references.slice(0,3);
    var extra = card.references.length - visibleRefs.length;
    var ci = colIndex(card.column);

    var dots = COLUMNS.map(function(c,i){
      var cls = i < ci ? "past" : (i === ci ? "active" : "");
      return '<span class="' + cls + '"></span>';
    }).join("");

    var showEngFlags = ci >= colIndex("engenharia");
    var engFlagsByRef = card.engFlags || {};
    var engFlagsHtml = showEngFlags
      ? '<span class="eng-flags" title="Encaixe / Sequência / Ficha — todas as referências">' +
          ENG_FLAGS.map(function(f){
            var allDone = card.references.every(function(r){ return engFlagsByRef[r] && engFlagsByRef[r][f.key]; });
            return '<span class="eng-flag ' + (allDone ? "done" : "pending") + '">' + f.initial + '</span>';
          }).join("") +
        '</span>'
      : "";

    var showFinalStatus = ci >= colIndex("demanda_final");
    var finalStatusHtml = showFinalStatus
      ? '<span class="final-status-dot ' + finalStatus(card) + '" title="Demanda (Final): ' + FINAL_STATUS_LABEL[finalStatus(card)] + '"></span>'
      : "";

    return (
      '<div class="card" draggable="true" data-id="' + card.id + '" tabindex="0" role="button" ' +
        'aria-label="' + esc(card.originalFabric) + ', ' + esc(brand.name) + '" style="--brand-color:' + brand.bg + '">' +
        '<div class="card-row-top">' +
          '<span class="brand-chip" style="--brand-bg:' + brand.bg + ';--brand-fg:' + brand.fg + ';background:var(--brand-bg);color:var(--brand-fg);">' +

        '<div class="card-substitute-row" title="' + esc(card.substituteFabric) + '">' +

  var draggingCardId = null;

  function bindBoardEvents(){
    var btn = document.getElementById("btnNewRequest");
    if (btn) btn.addEventListener("click", openCreatePanel);

    document.querySelectorAll(".brand-filter-select").forEach(function(sel){
      sel.addEventListener("change", function(){
        columnBrandFilter[sel.getAttribute("data-col")] = sel.value || null;
        renderAll();
      });
    });

    document.querySelectorAll(".card").forEach(function(el){
      el.addEventListener("click", function(){ openCardPanel(el.getAttribute("data-id")); });
      el.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openCardPanel(el.getAttribute("data-id")); }
      });
      el.addEventListener("dragstart", function(e){
        draggingCardId = el.getAttribute("data-id");
        e.dataTransfer.setData("text/plain", draggingCardId);
        e.dataTransfer.effectAllowed = "move";
        el.classList.add("dragging");
      });
      el.addEventListener("dragend", function(){
        el.classList.remove("dragging");
        draggingCardId = null;
        document.querySelectorAll(".card-list").forEach(function(l){
          l.classList.remove("drag-over", "drag-over-invalid");
        });
      });
    });

    document.querySelectorAll(".card-list").forEach(function(list){
      list.addEventListener("dragover", function(e){
        e.preventDefault();
        var destCol = list.getAttribute("data-col");
        var card = draggingCardId && state.cards.find(function(c){ return c.id === draggingCardId; });
        var valid = !card || validateMove(card, destCol).ok;
        e.dataTransfer.dropEffect = valid ? "move" : "none";
        list.classList.toggle("drag-over", valid);
        list.classList.toggle("drag-over-invalid", !valid);
      });
      list.addEventListener("dragleave", function(){ list.classList.remove("drag-over", "drag-over-invalid"); });
      list.addEventListener("drop", function(e){
        e.preventDefault();
        list.classList.remove("drag-over", "drag-over-invalid");
        var id = e.dataTransfer.getData("text/plain");
        if (id) moveCard(id, list.getAttribute("data-col"));
      });
    });
  }

  function renderPanel(){
    var card = state.cards.find(function(c){ return c.id === panelCardId; });
    if (!card) return;
    var brand = brandOf(card.brand);
    var totalDays = daysBetween(card.createdAt);
    var colDays = daysBetween(card.enteredColumnAt);

    var initialOk = initialComplete(card);
    var initialDoneCount = card.references.filter(function(r){ return card.actionsInitial[r] && card.actionsInitial[r].action; }).length;

    var engFlagsByRef = card.engFlags || {};
    var engOk = engineeringComplete(card);
    var engFlagsTotal = card.references.length * ENG_FLAGS.length;
    var engFlagsDone = 0;
    card.references.forEach(function(r){
      var f = engFlagsByRef[r] || {};
      ENG_FLAGS.forEach(function(flag){ if (f[flag.key]) engFlagsDone++; });
    });

    var finalOk = finalComplete(card);
    var finalDoneCount = card.references.filter(function(r){ return card.actionsFinal[r] && card.actionsFinal[r].finalized; }).length;

    var actionsSectionHtml = "";
    if (card.column === "demanda_inicial"){
      actionsSectionHtml =
        '<div class="panel-section">' +
          '<div class="section-label">Ações — Demanda (Inicial) <span class="badge ' + (initialOk?'ok':'pending') + '">' + initialDoneCount + '/' + card.references.length + ' definidas</span></div>' +
          card.references.map(function(r){
            var entry = card.actionsInitial[r];
            var cur = entry.action || "";
            var deVal = entry.deNumber != null ? entry.deNumber : "";
            var paraVal = entry.paraNumber != null ? entry.paraNumber : "";
            return (
              '<div class="ref-action-block">' +
                '<div class="action-row">' +
                  '<span class="ref-tag mono">' + esc(r) + '</span>' +
                  '<select data-ref="' + esc(r) + '" class="initialActionSelect">' +
                    '<option value="" ' + (cur===""?"selected":"") + ' disabled>Selecionar ação…</option>' +
                    INITIAL_ACTIONS.map(function(a){ return '<option value="' + esc(a) + '" ' + (cur===a?"selected":"") + '>' + esc(a) + '</option>'; }).join("") +
                  '</select>' +
                '</div>' +
                '<div class="depara-row">' +
                  '<span class="depara-label">De</span>' +
                  '<input type="number" inputmode="numeric" class="depara-input mono" data-ref="' + esc(r) + '" data-field="de" value="' + esc(deVal) + '" placeholder="Nº">' +
                  '<span class="depara-label">Para</span>' +
                  '<input type="number" inputmode="numeric" class="depara-input mono" data-ref="' + esc(r) + '" data-field="para" value="' + esc(paraVal) + '" placeholder="Nº">' +
                  '<label class="check-label">' +
                    '<input type="checkbox" class="deparaPadraoCheck" data-ref="' + esc(r) + '" ' + (entry.padrao?"checked":"") + '> Padrão' +
                  '</label>' +
                '</div>' +
              '</div>'
            );
          }).join("") +
        '</div>';
    } else if (card.column === "engenharia"){
      actionsSectionHtml =
        '<div class="panel-section">' +
          '<div class="section-label">Ações — Engenharia <span class="badge ' + (engOk?'ok':'pending') + '">' + engFlagsDone + '/' + engFlagsTotal + ' concluídas</span></div>' +
          card.references.map(function(r){
            var a = card.actionsInitial[r];
            var f = engFlagsByRef[r] || defaultEngFlags();
            return (
              '<div class="ref-action-block">' +
                '<div class="action-row">' +
                  '<span class="ref-tag mono">' + esc(r) + '</span>' +
                  '<span class="readonly-action">' + (a.action ? esc(formatInitialAction(a)) : '<em>Sem ação definida</em>') + '</span>' +
                '</div>' +
                '<div class="eng-flags-toggle">' +
                  ENG_FLAGS.map(function(flag){
                    return (
                      '<label class="check-label">' +
                        '<input type="checkbox" class="engFlagCheck" data-ref="' + esc(r) + '" data-flag="' + flag.key + '" ' + (f[flag.key]?"checked":"") + '> ' + esc(flag.label) + ' (' + flag.initial + ')' +
                      '</label>'
                    );
                  }).join("") +
                '</div>' +
              '</div>'
            );
          }).join("") +
        '</div>';
    } else if (card.column === "demanda_final"){
      var cardStatus = finalStatus(card);
      actionsSectionHtml =
        '<div class="panel-section">' +
          '<div class="section-label">Ações — Demanda (Final) ' +
            '<span class="badge ' + FINAL_STATUS_BADGE_CLASS[cardStatus] + '">' + FINAL_STATUS_LABEL[cardStatus] + '</span>' +
            '<span class="badge ' + (finalOk?'ok':'pending') + '">' + finalDoneCount + '/' + card.references.length + ' finalizadas</span>' +
          '</div>' +
          card.references.map(function(r){
            var f = card.actionsFinal[r];
            var cur = f.action || "";
            var canFinalize = finalRefActionObsComplete(card, r);
            return (
              '<div class="ref-action-block">' +
                '<div class="action-row">' +
                  '<span class="ref-tag mono">' + esc(r) + '</span>' +
                  '<select data-ref="' + esc(r) + '" class="finalActionSelect">' +
                    '<option value="" ' + (cur===""?"selected":"") + ' disabled>Selecionar ação…</option>' +
                    FINAL_ACTIONS.map(function(a){ return '<option value="' + esc(a) + '" ' + (cur===a?"selected":"") + '>' + esc(a) + '</option>'; }).join("") +
                  '</select>' +
                  '<label class="check-label' + (!canFinalize?' disabled':'') + '">' +
                    '<input type="checkbox" class="finalDoneCheck" data-ref="' + esc(r) + '" ' + (f.finalized?"checked":"") + (!canFinalize?" disabled":"") + '> Finalizada' +
                  '</label>' +
                '</div>' +
                '<textarea class="final-obs-input" data-ref="' + esc(r) + '" placeholder="Observação — detalhe a ação para esta referência…">' + esc(f.observacao || "") + '</textarea>' +
                (!canFinalize ? '<div class="hint">Preencha ação e observação para poder marcar como Finalizada.</div>' : '') +
              '</div>'
            );
          }).join("") +
        '</div>';
    }

    panelEl.innerHTML =
      '<div class="panel-head">' +
        '<div class="titles">' +
          '<div class="code" id="panel-title">' + esc(card.originalFabric) + '</div>' +
          '<div class="meta">Criado em ' + fmtDate(card.createdAt) + ' · ' + totalDays + ' dias no total · ' + colDays + ' dias em ' + esc(colLabel(card.column)) + '</div>' +
        '</div>' +
        '<button class="icon-btn" id="btnClosePanel" aria-label="Fechar">' + ICON_CLOSE + '</button>' +
      '</div>' +
      '<div class="panel-body">' +

        '<div class="panel-section">' +
          '<div class="section-label">Informações gerais</div>' +
          (card.image ? '<img class="attachment-preview" id="attachmentPreview" src="' + card.image + '" alt="Imagem de referência anexada">' : '') +
          '<div class="field" style="margin-bottom:8px;">' +
            '<span class="brand-chip" style="--brand-bg:' + brand.bg + ';--brand-fg:' + brand.fg + ';background:var(--brand-bg);color:var(--brand-fg);"><span class="dot"></span>' + esc(brand.name) + '</span>' +
          '</div>' +
          '<div class="field">' +
            '<label>Tecido/Aviamento atual → substituto</label>' +
            '<div class="swap-row">' +
              '<span class="swap-chip" title="Tecido/Aviamento atual">' + esc(card.originalFabric || "—") + '</span>' +
              '<span class="swap-arrow">' + ICON_ARROW + '</span>' +
              '<span class="swap-chip substitute" title="Tecido/Aviamento substituto">' + esc(card.substituteFabric || "a definir") + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="field">' +
            '<label>Referências afetadas</label>' +
            '<div class="ref-list">' + card.references.map(function(r){ return '<span class="ref-pill mono">' + esc(r) + '</span>'; }).join("") + '</div>' +
          '</div>' +
          (card.details ? '<div class="field"><label>Detalhes/Observações</label><div class="detail-text">' + esc(card.details) + '</div></div>' : '') +
          (card.tipo === "tecido" && card.tecido ? renderTecidoInfo(card.tecido) : '') +
        '</div>' +

        actionsSectionHtml +

        '<div class="panel-section">' +
          '<div class="section-label">Mover cartão</div>' +
          '<div class="move-grid">' +
            COLUMNS.map(function(c){
              var isCurrent = c.id === card.column;
              var v = validateMove(card, c.id);
              return '<button class="move-btn' + (isCurrent?' current':'') + (!isCurrent && !v.ok?' blocked':'') + '" data-dest="' + c.id + '"' + (isCurrent?' disabled':'') + '>' + esc(c.label) + '</button>';
            }).join("") +
          '</div>' +
        '</div>' +

        '<div class="panel-section">' +
          '<div id="deleteWrap"><button class="danger-link" id="btnDeleteCard">Excluir solicitação</button></div>' +
        '</div>' +

      '</div>';

    document.getElementById("btnClosePanel").addEventListener("click", closePanel);

    var attachmentPreview = document.getElementById("attachmentPreview");
    if (attachmentPreview) attachmentPreview.addEventListener("click", function(){
      window.open(card.image, "_blank");
    });

    panelEl.querySelectorAll(".initialActionSelect").forEach(function(sel){
      sel.addEventListener("change", function(){
        var ref = sel.getAttribute("data-ref");
        card.actionsInitial[ref].action = sel.value || null;
        save();
        renderAll();
        renderPanel();
      });
    });
    panelEl.querySelectorAll(".depara-input").forEach(function(inp){
      inp.addEventListener("change", function(){
        var ref = inp.getAttribute("data-ref");
        var field = inp.getAttribute("data-field") === "para" ? "paraNumber" : "deNumber";
        card.actionsInitial[ref][field] = inp.value.trim() === "" ? null : inp.value.trim();
        save();
        renderAll();
      });
    });
    panelEl.querySelectorAll(".deparaPadraoCheck").forEach(function(chk){
      chk.addEventListener("change", function(){
        var ref = chk.getAttribute("data-ref");
        card.actionsInitial[ref].padrao = chk.checked;
        save();
        renderAll();
      });
    });
    panelEl.querySelectorAll(".engFlagCheck").forEach(function(chk){
      chk.addEventListener("change", function(){
        var ref = chk.getAttribute("data-ref");
        var key = chk.getAttribute("data-flag");
        if (!card.engFlags) card.engFlags = {};
        if (!card.engFlags[ref]) card.engFlags[ref] = defaultEngFlags();
        card.engFlags[ref][key] = chk.checked;
        save();
        renderAll();
        renderPanel();
      });
    });
    panelEl.querySelectorAll(".finalActionSelect").forEach(function(sel){
      sel.addEventListener("change", function(){
        var ref = sel.getAttribute("data-ref");
        card.actionsFinal[ref].action = sel.value || null;
        save();
        renderAll();
        renderPanel();
      });
    });
    panelEl.querySelectorAll(".finalDoneCheck").forEach(function(chk){
      chk.addEventListener("change", function(){
        var ref = chk.getAttribute("data-ref");
        card.actionsFinal[ref].finalized = chk.checked;
        save();
        renderAll();
        renderPanel();
      });
    });
    panelEl.querySelectorAll(".final-obs-input").forEach(function(ta){
      ta.addEventListener("change", function(){
        var ref = ta.getAttribute("data-ref");
        card.actionsFinal[ref].observacao = ta.value;
        save();
        renderAll();
        renderPanel();
      });
    });
    panelEl.querySelectorAll(".move-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        moveCard(card.id, btn.getAttribute("data-dest"));
      });
    });
    var deleteWrap = document.getElementById("deleteWrap");
    function bindDeleteLink(){
      deleteWrap.innerHTML = '<button class="danger-link" id="btnDeleteCard">Excluir solicitação</button>';
      document.getElementById("btnDeleteCard").addEventListener("click", function(){
        deleteWrap.innerHTML =
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<span style="font-size:12px;color:var(--ink-soft);">Excluir esta solicitação? Não pode ser desfeita.</span>' +
            '<button type="button" class="danger-link" id="btnDeleteConfirm">Confirmar exclusão</button>' +
            '<button type="button" class="move-btn" id="btnDeleteCancel">Cancelar</button>' +
          '</div>';
        document.getElementById("btnDeleteConfirm").addEventListener("click", function(){
          state.cards = state.cards.filter(function(c){ return c.id !== card.id; });
          save();
          renderAll();
          closePanel();
          toast("Solicitação excluída.", "success");
        });
        document.getElementById("btnDeleteCancel").addEventListener("click", bindDeleteLink);
      });
    }
    bindDeleteLink();
  }

  document.getElementById("globalSearch").addEventListener("input", function(e){
    searchQuery = e.target.value.trim().toLowerCase();
    renderAll();
  });

  /* ---------- Init ---------- */
  load().then(renderAll);
  setInterval(function(){ renderAll(); if (panelCardId) renderPanel(); }, 60000);
  setInterval(pollSync, SYNC_INTERVAL_MS);
})();
</script>
